name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['src--release_created'] }}
      version: ${{ steps.release.outputs['src--version'] }}
      tag: ${{ steps.release.outputs['src--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: st0o0/github-workflows/.github/workflows/docker-release.yml@main
    with:
      version: ${{ needs.release-please.outputs.version }}
      image-name: ghcr.io/st0o0/njord
      image-description: "Multi-model weather intelligence for Home Assistant"
      platforms: linux/amd64,linux/arm64,linux/arm/v7
    permissions:
      contents: read
      packages: write
      id-token: write

  docs:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: st0o0/github-workflows/.github/workflows/docs.yml@main
    with:
      needs-dotnet-build: false
    permissions:
      contents: read
      pages: write
      id-token: write

  notify-ha:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.HA_NJORD_PAT }}
          repository: st0o0/ha-njord
          event-type: proto-sync
          client-payload: '{"version": "${{ needs.release-please.outputs.version }}"}'
