name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    uses: st0o0/github-workflows/.github/workflows/release-please.yml@main
    permissions:
      contents: write
      pull-requests: write

  docker:
    needs: release-please
    if: fromJSON(needs.release-please.outputs.json)['src--release_created'] == 'true'
    uses: st0o0/github-workflows/.github/workflows/docker-release.yml@main
    with:
      version: ${{ fromJSON(needs.release-please.outputs.json)['src--version'] }}
      image-name: ghcr.io/st0o0/njord
      image-description: "Multi-model weather intelligence for Home Assistant"
      platforms: linux/amd64,linux/arm64,linux/arm/v7
    permissions:
      contents: read
      packages: write
      id-token: write

  docs:
    needs: release-please
    if: fromJSON(needs.release-please.outputs.json)['src--release_created'] == 'true'
    uses: st0o0/github-workflows/.github/workflows/docs.yml@main
    with:
      needs-dotnet-build: false
    permissions:
      contents: read
      pages: write
      id-token: write

  notify-ha:
    needs: release-please
    if: fromJSON(needs.release-please.outputs.json)['src--release_created'] == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.HA_NJORD_PAT }}
          repository: st0o0/ha-njord
          event-type: proto-sync
          client-payload: '{"version": "${{ fromJSON(needs.release-please.outputs.json)[''src--version''] }}"}'
