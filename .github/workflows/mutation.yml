name: Mutation testing

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [Forecast, Weather.Alerts, Core]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json

      - name: Run Stryker.NET
        run: bash scripts/run-mutation.sh ${{ matrix.project }} --local

      - name: Add the mutation score to the job summary
        if: always()
        run: |
          report=$(ls src/Njord.${{ matrix.project }}.Tests/StrykerOutput/*/reports/mutation-report.md | head -n 1)
          { echo "## Mutation score: ${{ matrix.project }}"; cat "$report"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ matrix.project }}
          path: src/Njord.${{ matrix.project }}.Tests/StrykerOutput/*/reports
