name: Dev Build

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    uses: st0o0/github-workflows/.github/workflows/dotnet-dev-build.yml@main
    with:
      image-name: ghcr.io/st0o0/njord
      image-description: "Dev build of njord"
      publish-project: Njord/Njord.csproj
    permissions:
      contents: read
      packages: write
      pull-requests: write
