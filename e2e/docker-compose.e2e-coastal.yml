services:
  njord:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: njord-e2e
    restart: "no"
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - njord-data:/app/data
    environment:
      # ── Locations (2 coastal cities, Marine should work) ───
      - Njord__Locations__0__Name=Sydney
      - Njord__Locations__0__Latitude=-33.8688
      - Njord__Locations__0__Longitude=151.2093
      - Njord__Locations__1__Name=Tokyo
      - Njord__Locations__1__Latitude=35.6762
      - Njord__Locations__1__Longitude=139.6503

      # ── Weather (7 days, 2 models) ────────────────────────
      - Njord__Weather__ForecastDays=7
      - Njord__Weather__Models__0=ecmwf_ifs025_ensemble_mean
      - Njord__Weather__Models__1=ecmwf_aifs025_ensemble_mean

      # ── Enrichments (all enabled) ─────────────────────────
      - Njord__Features__Weather__Frost__Enabled=true
      - Njord__Features__Weather__Heat__Enabled=true
      - Njord__Features__Weather__Storm__Enabled=true
      - Njord__Features__Weather__HeavyRain__Enabled=true
      - Njord__Features__Weather__Uv__Enabled=true
      - Njord__Features__Weather__Fog__Enabled=true
      - Njord__Features__Weather__Snow__Enabled=true
      - Njord__Features__Weather__PressureDrop__Enabled=true
      - Njord__Features__Weather__Thunderstorm__Enabled=true
      - Njord__Features__Weather__Ice__Enabled=true
      - Njord__Features__Weather__WindChill__Enabled=true
      - Njord__Features__Weather__Visibility__Enabled=true
      - Njord__Features__Weather__TropicalNight__Enabled=true
      - Njord__Features__Weather__Humidity__Enabled=true
      - Njord__Features__AirQuality__Pollen__Enabled=true
      - Njord__Features__AirQuality__Pm25__Enabled=true
      - Njord__Features__AirQuality__Dust__Enabled=true
      - Njord__Features__Lifestyle__Commute__Enabled=true
      - Njord__Features__Lifestyle__Exercise__Enabled=true
      - Njord__Features__Lifestyle__Laundry__Enabled=true
      - Njord__Features__Lifestyle__Outdoor__Enabled=true
      - Njord__Features__Lifestyle__Bbq__Enabled=true
      - Njord__Features__Lifestyle__NightVentilation__Enabled=true
      - Njord__Features__Lifestyle__Ventilation__Enabled=true
      - Njord__Features__Lifestyle__Gardening__Enabled=true
      - Njord__Features__Insight__ConfidenceTrend__Enabled=true
      - Njord__Features__Insight__FrontApproaching__Enabled=true
      - Njord__Features__Energy__SolarYield__Enabled=true
      - Njord__Features__Energy__SatelliteRadiation__Enabled=true
      - Njord__Features__AirQuality__PollenTrend__Enabled=true
      - Njord__Features__Flood__FloodRisk__Enabled=true
      - Njord__Features__Flood__FloodRain__Enabled=true
      - Njord__Features__Flood__FloodTimeline__Enabled=true
      - Njord__Features__Marine__Swimming__Enabled=true
      - Njord__Features__Marine__Surf__Enabled=true
      - Njord__Features__Weather__ModelComparison__Enabled=true
      - Njord__Features__Insight__SeasonalOutlook__Enabled=true
      - Njord__Features__Lifestyle__PlantingSafe__Enabled=true

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133
    container_name: ha-e2e
    restart: "no"
    ports:
      - "8123:8123"
    volumes:
      - ha-config:/config
      - ../../ha-njord/custom_components/njord:/config/custom_components/njord:ro
    environment:
      - TZ=Australia/Sydney

volumes:
  njord-data:
  ha-config:
