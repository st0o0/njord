services:
  njord:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: njord-e2e
    restart: "no"
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - njord-data:/app/data
    environment:
      # ── Locations (3 locations: inland, inland, coastal for Marine) ──
      - Njord__Locations__0__Name=Lucerne
      - Njord__Locations__0__Latitude=47.0502
      - Njord__Locations__0__Longitude=8.3093
      - Njord__Locations__1__Name=Bern
      - Njord__Locations__1__Latitude=46.9480
      - Njord__Locations__1__Longitude=7.4474
      - Njord__Locations__2__Name=Nice
      - Njord__Locations__2__Latitude=43.7102
      - Njord__Locations__2__Longitude=7.2620

      # ── Weather (max forecast days, all 3 models) ──────────
      - Njord__Forecast__ForecastDays=16
      - Njord__Ensemble__Models__0=ecmwf_ifs025_ensemble_mean
      - Njord__Ensemble__Models__1=ecmwf_aifs025_ensemble_mean
      - Njord__Ensemble__Models__2=ukmo_global_ensemble_mean_20km

      # ── Domain options (maxed) ─────────────────────────────
      - Njord__AirQuality__ForecastDays=7
      - Njord__AirQuality__Region=Europe
      - Njord__Flood__ForecastDays=210
      - Njord__Flood__IncludeEnsemble=true
      - Njord__Marine__ForecastDays=8
      - Njord__Seasonal__ForecastMonths=6
      - Njord__Satellite__PastHours=48

      # ── Solar yield ────────────────────────────────────────
      - Njord__SolarYield__PeakKw=10.0
      - Njord__SolarYield__Tilt=45
      - Njord__SolarYield__Azimuth=180

      # ── Polling (no BudgetOverride - test the real guard) ──
      # - Njord__Polling__BudgetOverride=600000

      # ── Alert thresholds (lowered to trigger alerts) ───────
      - Njord__Features__Frost__Thresholds__0=5
      - Njord__Features__Frost__Thresholds__1=0
      - Njord__Features__Frost__Thresholds__2=-5
      - Njord__Features__Heat__Thresholds__0=25
      - Njord__Features__Heat__Thresholds__1=30
      - Njord__Features__Heat__Thresholds__2=35
      - Njord__Features__Storm__Thresholds__0=40
      - Njord__Features__Storm__Thresholds__1=60
      - Njord__Features__Storm__Thresholds__2=80
      - Njord__Features__Uv__Thresholds__0=3
      - Njord__Features__Uv__Thresholds__1=6
      - Njord__Features__Uv__Thresholds__2=8
      - Njord__Features__Humidity__Thresholds__0=10
      - Njord__Features__Humidity__Thresholds__1=16
      - Njord__Features__Humidity__Thresholds__2=21
      - Njord__Features__Visibility__Thresholds__0=25000
      - Njord__Features__Visibility__Thresholds__1=5000
      - Njord__Features__Visibility__Thresholds__2=1000
      - Njord__Features__Snow__Thresholds__0=0.5
      - Njord__Features__Snow__Thresholds__1=2
      - Njord__Features__Snow__Thresholds__2=10
      - Njord__Features__HeavyRain__Thresholds__0=2
      - Njord__Features__HeavyRain__Thresholds__1=5
      - Njord__Features__HeavyRain__Thresholds__2=15

      # ── Enrichments (all enabled) ──────────────────────────
      - Njord__Features__Frost__Enabled=true
      - Njord__Features__Heat__Enabled=true
      - Njord__Features__Storm__Enabled=true
      - Njord__Features__HeavyRain__Enabled=true
      - Njord__Features__Uv__Enabled=true
      - Njord__Features__Fog__Enabled=true
      - Njord__Features__Snow__Enabled=true
      - Njord__Features__PressureDrop__Enabled=true
      - Njord__Features__Thunderstorm__Enabled=true
      - Njord__Features__Ice__Enabled=true
      - Njord__Features__WindChill__Enabled=true
      - Njord__Features__Visibility__Enabled=true
      - Njord__Features__TropicalNight__Enabled=true
      - Njord__Features__Humidity__Enabled=true
      - Njord__Features__Pollen__Enabled=true
      - Njord__Features__Pm25__Enabled=true
      - Njord__Features__Dust__Enabled=true
      - Njord__Features__Commute__Enabled=true
      - Njord__Features__Exercise__Enabled=true
      - Njord__Features__Laundry__Enabled=true
      - Njord__Features__Outdoor__Enabled=true
      - Njord__Features__Bbq__Enabled=true
      - Njord__Features__NightVentilation__Enabled=true
      - Njord__Features__Ventilation__Enabled=true
      - Njord__Features__Gardening__Enabled=true
      - Njord__Features__ConfidenceTrend__Enabled=true
      - Njord__Features__FrontApproaching__Enabled=true
      - Njord__Features__SolarYield__Enabled=true
      - Njord__Features__SatelliteRadiation__Enabled=true
      - Njord__Features__PollenTrend__Enabled=true
      - Njord__Features__FloodRisk__Enabled=true
      - Njord__Features__FloodRain__Enabled=true
      - Njord__Features__FloodTimeline__Enabled=true
      - Njord__Features__Swimming__Enabled=true
      - Njord__Features__Surf__Enabled=true
      - Njord__Features__ModelComparison__Enabled=true
      - Njord__Features__SeasonalOutlook__Enabled=true
      - Njord__Features__PlantingSafe__Enabled=true

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133
    container_name: ha-e2e
    restart: "no"
    ports:
      - "8123:8123"
    volumes:
      - ha-config:/config
      - ../../ha-njord/custom_components/njord:/config/custom_components/njord:ro
    environment:
      - TZ=Europe/Zurich

volumes:
  njord-data:
  ha-config:
