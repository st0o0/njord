services:
  njord:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: njord-e2e
    restart: "no"
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - njord-data:/app/data
    environment:
      # ── Location (single inland city) ──────────────────────
      - Njord__Locations__0__Name=Berlin
      - Njord__Locations__0__Latitude=52.5200
      - Njord__Locations__0__Longitude=13.4050

      # ── Weather (minimal: 2 days, default single model) ───
      - Njord__Weather__ForecastDays=2

      # No Njord__Features__ env vars: rely entirely on defaults
      # Defaults: 14 weather alerts + Commute + Pollen + Pm25

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133
    container_name: ha-e2e
    restart: "no"
    ports:
      - "8123:8123"
    volumes:
      - ha-config:/config
      - ../../ha-njord/custom_components/njord:/config/custom_components/njord:ro
    environment:
      - TZ=Europe/Berlin

volumes:
  njord-data:
  ha-config:
