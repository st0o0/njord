services:
  njord:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: njord-e2e
    restart: "no"
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - njord-data:/app/data
    environment:
      # ── Location (coordinates are required) ──
      - Njord__Locations__0__Name=Lucerne
      - Njord__Locations__0__Latitude=47.0502
      - Njord__Locations__0__Longitude=8.3093

      # ── Weather ────────────────────────────────────────────────
      - Njord__Weather__ForecastDays=4

      # ── Enrichments (all enabled for E2E) ──────────────────────
      - Njord__Features__Weather__Frost=true
      - Njord__Features__Weather__Heat=true
      - Njord__Features__Weather__Storm=true
      - Njord__Features__Weather__HeavyRain=true
      - Njord__Features__Weather__Uv=true
      - Njord__Features__Weather__Fog=true
      - Njord__Features__Weather__Snow=true
      - Njord__Features__Weather__PressureDrop=true
      - Njord__Features__Weather__Thunderstorm=true
      - Njord__Features__Weather__Ice=true
      - Njord__Features__Weather__WindChill=true
      - Njord__Features__Weather__Visibility=true
      - Njord__Features__Weather__TropicalNight=true
      - Njord__Features__Weather__Humidity=true
      - Njord__Features__AirQuality__Pollen=true
      - Njord__Features__AirQuality__Pm25=true
      - Njord__Features__Lifestyle__Commute=true
      - Njord__Features__Lifestyle__Exercise=true
      - Njord__Features__Lifestyle__Laundry=true
      - Njord__Features__Lifestyle__Outdoor=true
      - Njord__Features__Lifestyle__Bbq=true
      - Njord__Features__Lifestyle__NightVentilation=true
      - Njord__Features__Lifestyle__Ventilation=true
      - Njord__Features__Lifestyle__Gardening=true
      - Njord__Features__Insight__ConfidenceTrend=true
      - Njord__Features__Insight__FrontApproaching=true
      - Njord__Features__Energy__SolarYield=true
      - Njord__Features__AirQuality__PollenTrend=true
      - Njord__Features__Flood__FloodRisk=true
      - Njord__Features__Flood__FloodRain=true
      - Njord__Features__Flood__FloodTimeline=true
      - Njord__Features__Marine__Swimming=true
      - Njord__Features__Marine__Surf=true
      - Njord__Features__Insight__SeasonalOutlook=true


  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: ha-e2e
    restart: "no"
    ports:
      - "8123:8123"
    volumes:
      - ha-config:/config
      - ../../ha-njord/custom_components/njord:/config/custom_components/njord:ro
    environment:
      - TZ=Europe/Zurich

volumes:
  njord-data:
  ha-config:
