services:
  njord:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: njord-e2e
    restart: "no"
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - njord-data:/app/data
    environment:
      # ── Location (explicit coordinates; geocoding is not guaranteed in every environment) ──
      - Njord__Locations__0__Name=Lucerne
      - Njord__Locations__0__Latitude=47.0502
      - Njord__Locations__0__Longitude=8.3093

      # ── Weather ────────────────────────────────────────────────
      - Njord__Weather__ForecastDays=4
      - Njord__Weather__IncludeSolar=true

      # ── Enrichments (all enabled for E2E) ──────────────────────
      - Njord__Enrichments__WeatherAlerts=true
      - Njord__Enrichments__CommuteSafety=true
      - Njord__Enrichments__PollenAlert=true
      - Njord__Enrichments__Pm25Alert=true
      - Njord__Enrichments__VentilationWindow=true
      - Njord__Enrichments__ExerciseAdvisory=true
      - Njord__Enrichments__LaundryScore=true
      - Njord__Enrichments__NightVentilation=true
      - Njord__Enrichments__ConfidenceTrend=true
      - Njord__Enrichments__PollenTrend=true
      - Njord__Enrichments__FloodRisk=true
      - Njord__Enrichments__FloodRain=true
      - Njord__Enrichments__SwimmingConditions=true
      - Njord__Enrichments__SolarYield=true
      - Njord__Enrichments__GardeningAdvisory=true
      - Njord__Enrichments__OutdoorScore=true
      - Njord__Enrichments__BBQScore=true
      - Njord__Enrichments__ApproachingFront=true
      - Njord__Enrichments__FloodTimeline=true
      - Njord__Enrichments__ClimateAnomaly=true

      # ── MQTT (optional, enable for MQTT sections) ──────────────
      # - Njord__Mqtt__Enabled=true
      # - Njord__Mqtt__Host=mosquitto

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: ha-e2e
    restart: "no"
    ports:
      - "8123:8123"
    volumes:
      - ha-config:/config
      - ../../ha-njord/custom_components/njord:/config/custom_components/njord:ro
    environment:
      - TZ=Europe/Zurich

volumes:
  njord-data:
  ha-config:
