services:
  njord:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: njord-e2e
    restart: "no"
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - njord-data:/app/data
    environment:
      # ── Location (minimal: 1 location) ────────────────────────
      - Njord__Locations__0__Name=lucerne
      - Njord__Locations__0__Latitude=47.05
      - Njord__Locations__0__Longitude=8.31

      # ── Weather ───────────────────────────────────────────────
      - Njord__Weather__ForecastDays=4

      # ── Enrichment (all features enabled) ─────────────────────
      - Njord__Enrichment__Consensus__Enabled=true
      - Njord__Enrichment__Alerts__Enabled=true
      - Njord__Enrichment__Derived__Enabled=true
      - Njord__Enrichment__Trends__Enabled=true
      - Njord__Enrichment__Indices__Enabled=true

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4
    container_name: ha-e2e
    restart: "no"
    ports:
      - "8123:8123"
    volumes:
      - ha-config:/config
      - ../../ha-njord/custom_components/njord:/config/custom_components/njord:ro
    environment:
      - TZ=Europe/Zurich

volumes:
  njord-data:
  ha-config:
