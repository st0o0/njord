services:
  njord:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: njord-e2e
    restart: "no"
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - njord-data:/app/data
    environment:
      # ── Location (coordinates are required) ──
      - Njord__Locations__0__Name=Lucerne
      - Njord__Locations__0__Latitude=47.0502
      - Njord__Locations__0__Longitude=8.3093

      # ── Weather ────────────────────────────────────────────────
      - Njord__Weather__ForecastDays=4

      # ── Enrichments (all enabled for E2E) ──────────────────────
      - Njord__Features__FrostAlert=true
      - Njord__Features__HeatAlert=true
      - Njord__Features__StormAlert=true
      - Njord__Features__RainAlert=true
      - Njord__Features__UvAlert=true
      - Njord__Features__FogAlert=true
      - Njord__Features__SnowAlert=true
      - Njord__Features__PressureDropAlert=true
      - Njord__Features__ThunderstormAlert=true
      - Njord__Features__IceAlert=true
      - Njord__Features__WindChillAlert=true
      - Njord__Features__VisibilityAlert=true
      - Njord__Features__TropicalNightAlert=true
      - Njord__Features__HumidityAlert=true
      - Njord__Features__PollenAlert=true
      - Njord__Features__Pm25Alert=true
      - Njord__Features__CommuteSafety=true
      - Njord__Features__ExerciseAdvisory=true
      - Njord__Features__LaundryScore=true
      - Njord__Features__OutdoorScore=true
      - Njord__Features__BBQScore=true
      - Njord__Features__NightVentilation=true
      - Njord__Features__VentilationWindow=true
      - Njord__Features__GardeningAdvisory=true
      - Njord__Features__ConfidenceTrend=true
      - Njord__Features__ApproachingFront=true
      - Njord__Features__SolarYield=true
      - Njord__Features__PollenTrend=true
      - Njord__Features__FloodRisk=true
      - Njord__Features__FloodRain=true
      - Njord__Features__FloodTimeline=true
      - Njord__Features__SwimmingConditions=true
      - Njord__Features__SurfConditions=true


  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: ha-e2e
    restart: "no"
    ports:
      - "8123:8123"
    volumes:
      - ha-config:/config
      - ../../ha-njord/custom_components/njord:/config/custom_components/njord:ro
    environment:
      - TZ=Europe/Zurich

volumes:
  njord-data:
  ha-config:
