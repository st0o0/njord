services:
  njord:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: njord-e2e
    restart: "no"
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - njord-data:/app/data
    environment:
      # ── Location (coordinates are required) ──
      - Njord__Locations__0__Name=Lucerne
      - Njord__Locations__0__Latitude=47.0502
      - Njord__Locations__0__Longitude=8.3093

      # ── Weather (primary: deterministic Forecast API, best_match) ─
      - Njord__Forecast__ForecastDays=4

      # ── Enrichments (all enabled for E2E) ──────────────────────
      - Njord__Features__Forecast__Frost__Enabled=true
      - Njord__Features__Forecast__Heat__Enabled=true
      - Njord__Features__Forecast__Storm__Enabled=true
      - Njord__Features__Forecast__HeavyRain__Enabled=true
      - Njord__Features__Forecast__Uv__Enabled=true
      - Njord__Features__Forecast__Fog__Enabled=true
      - Njord__Features__Forecast__Snow__Enabled=true
      - Njord__Features__Forecast__PressureDrop__Enabled=true
      - Njord__Features__Forecast__Thunderstorm__Enabled=true
      - Njord__Features__Forecast__Ice__Enabled=true
      - Njord__Features__Forecast__WindChill__Enabled=true
      - Njord__Features__Forecast__Visibility__Enabled=true
      - Njord__Features__Forecast__TropicalNight__Enabled=true
      - Njord__Features__Forecast__Humidity__Enabled=true
      - Njord__Features__AirQuality__Pollen__Enabled=true
      - Njord__Features__AirQuality__Pm25__Enabled=true
      - Njord__Features__AirQuality__Dust__Enabled=true
      - Njord__Features__Lifestyle__Commute__Enabled=true
      - Njord__Features__Lifestyle__Exercise__Enabled=true
      - Njord__Features__Lifestyle__Laundry__Enabled=true
      - Njord__Features__Lifestyle__Outdoor__Enabled=true
      - Njord__Features__Lifestyle__Bbq__Enabled=true
      - Njord__Features__Lifestyle__NightVentilation__Enabled=true
      - Njord__Features__Lifestyle__Ventilation__Enabled=true
      - Njord__Features__Lifestyle__Gardening__Enabled=true
      - Njord__Features__Insight__ConfidenceTrend__Enabled=true
      - Njord__Features__Insight__FrontApproaching__Enabled=true
      - Njord__Features__Energy__SolarYield__Enabled=true
      - Njord__Features__Energy__SatelliteRadiation__Enabled=true
      - Njord__Features__AirQuality__PollenTrend__Enabled=true
      - Njord__Features__Flood__FloodRisk__Enabled=true
      - Njord__Features__Flood__FloodRain__Enabled=true
      - Njord__Features__Flood__FloodTimeline__Enabled=true
      - Njord__Features__Marine__Swimming__Enabled=true
      - Njord__Features__Marine__Surf__Enabled=true
      - Njord__Features__Forecast__RainProbability__Enabled=true
      - Njord__Features__Forecast__WetBulbDanger__Enabled=true
      - Njord__Features__Lifestyle__ClearSkyUv__Enabled=true
      - Njord__Features__Forecast__SnowDepthWatch__Enabled=true
      # ── Ensemble (comparison models for ModelComparison) ────────
      - Njord__Forecast__Models__0=ecmwf_ifs025_ensemble_mean
      - Njord__Forecast__Models__1=ecmwf_aifs025_ensemble_mean
      - Njord__Forecast__Models__2=ukmo_global_ensemble_mean_20km
      - Njord__Features__Forecast__ModelComparison__Enabled=true
      - Njord__Features__Insight__SeasonalOutlook__Enabled=true


  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133
    container_name: ha-e2e
    restart: "no"
    ports:
      - "8123:8123"
    volumes:
      - ha-config:/config
      - ../../ha-njord/custom_components/njord:/config/custom_components/njord:ro
    environment:
      - TZ=Europe/Zurich

volumes:
  njord-data:
  ha-config:
