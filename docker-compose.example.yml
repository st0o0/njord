services:
  njord:
    image: ghcr.io/st0o0/njord:latest@sha256:6f03fba66ca630683af2e11f6c11d3ef35f284bec5ef82f0b353636fbed25124
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP: health and metrics
      - "8081:8081"   # gRPC: Home Assistant (ha-njord)
    volumes:
      - njord-data:/app/data
    environment:
      # ── Locations ─────────────────────────────────────────────
      - Njord__Locations__0__Name=home
      - Njord__Locations__0__Latitude=47.05
      - Njord__Locations__0__Longitude=8.31
      #- Njord__Locations__1__Name=office
      #- Njord__Locations__1__Latitude=47.38
      #- Njord__Locations__1__Longitude=8.54
      # Latitude and Longitude are required for every location.

      # ── Polling & Weather ─────────────────────────────────────
      #- Njord__Polling__PollInterval=01:00:00
      #- Njord__Weather__ForecastDays=4
      # Forecast days per domain (only used when an enabled feature needs the domain)
      #- Njord__AirQuality__ForecastDays=5   # 1-7
      #- Njord__Marine__ForecastDays=8       # 1-8
      #- Njord__Flood__ForecastDays=92       # 1-210
      #- Njord__Flood__IncludeEnsemble=false # 50 GloFAS members, adds confidence to FloodRisk, costs 5 calls per flood request
      # Features decide which domains are polled (the union of what the enabled ones read).
      # On by default: the 14 weather alerts (FrostAlert, HeatAlert, ...), CommuteSafety, PollenAlert, Pm25Alert.
      # Switch single features on (adds their domain) or off:
      #- Njord__Features__FrostAlert=false
      #- Njord__Features__FloodRisk=true
      #- Njord__Features__FloodRain=true
      #- Njord__Features__SwimmingConditions=true
      #- Njord__Features__SurfConditions=true # swell vs wind waves, scored from swell period/height and wind direction
      #- Njord__Features__VentilationWindow=true
      #- Njord__Features__ExerciseAdvisory=true
      #- Njord__Features__LaundryScore=true
      #- Njord__Features__PollenTrend=true
      #- Njord__Features__NightVentilation=true
      #- Njord__Features__ConfidenceTrend=true
      #- Njord__Features__SeasonalOutlook=true # 3-month outlook, one extra call per day and location
      #- Njord__Features__SatelliteRadiation=true # observed solar irradiance, about 720 extra calls per month and location
      #- Njord__Features__PollenAlert=false
      # Poll interval of a model whose update cycle is not learned yet:
      #- Njord__Polling__DiscoveryInterval=00:20:00

      # ── Persistence ───────────────────────────────────────────
      #- Njord__Persistence__Provider=Sqlite
      #- Njord__Persistence__DataPath=data/njord.db
      ## Alternative for PostgreSQL (not defaults):
      #- Njord__Persistence__Provider=PostgreSql
      #- Njord__Persistence__ConnectionString=Host=db;Database=njord;Username=njord;Password=secret

      # ── Budget (self-throttle below Open-Meteo free tier) ─────
      #- Njord__Polling__BudgetOverride__RequestsPerMonth=300000
      #- Njord__Polling__BudgetOverride__RequestsPerMinute=600

      # ── Enrichment ────────────────────────────────────────────
      #- Njord__Enrichment__Alerts__Enabled=true
      #- Njord__Enrichment__Alerts__FrostThresholds__0=0
      #- Njord__Enrichment__Alerts__FrostThresholds__1=-5
      #- Njord__Enrichment__Alerts__FrostThresholds__2=-15
      #- Njord__Enrichment__Alerts__HeatThresholds__0=30
      #- Njord__Enrichment__Alerts__HeatThresholds__1=35
      #- Njord__Enrichment__Alerts__HeatThresholds__2=40
      #- Njord__Enrichment__Alerts__StormGustThresholds__0=17
      #- Njord__Enrichment__Alerts__StormGustThresholds__1=25
      #- Njord__Enrichment__Alerts__StormGustThresholds__2=33
      #- Njord__Enrichment__Alerts__HeavyRainHourlyThreshold=10
      #- Njord__Enrichment__Alerts__HeavyRainDailyThreshold=25
      #- Njord__Enrichment__Alerts__PressureDropThreshold=5
      #- Njord__Enrichment__Alerts__PressureDropSevereThreshold=10
      #- Njord__Enrichment__Alerts__FogPersistentHours=4
      #- Njord__Enrichment__Alerts__CapeThreshold=1000
      #- Njord__Enrichment__Alerts__ThunderstormPrecipThreshold=5
      #- Njord__Enrichment__Alerts__ThunderstormGustThreshold=15
      #- Njord__Enrichment__Alerts__IceThreshold=2
      #- Njord__Enrichment__Alerts__WindChillThresholds__0=-10
      #- Njord__Enrichment__Alerts__WindChillThresholds__1=-20
      #- Njord__Enrichment__Alerts__WindChillThresholds__2=-30
      #- Njord__Enrichment__Alerts__VisibilityThresholds__0=1000
      #- Njord__Enrichment__Alerts__VisibilityThresholds__1=200
      #- Njord__Enrichment__Alerts__VisibilityThresholds__2=50
      #- Njord__Enrichment__Alerts__TropicalNightThresholds__0=20
      #- Njord__Enrichment__Alerts__TropicalNightThresholds__1=23
      #- Njord__Enrichment__Alerts__TropicalNightThresholds__2=25
      #- Njord__Enrichment__Alerts__HumidityThresholds__0=16
      #- Njord__Enrichment__Alerts__HumidityThresholds__1=21
      #- Njord__Enrichment__Alerts__HumidityThresholds__2=24

volumes:
  njord-data:
