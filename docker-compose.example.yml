services:
  njord:
    image: ghcr.io/st0o0/njord:latest@sha256:6f03fba66ca630683af2e11f6c11d3ef35f284bec5ef82f0b353636fbed25124
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP: health and metrics
      - "8081:8081"   # gRPC: Home Assistant (ha-njord)
    volumes:
      - njord-data:/app/data
    environment:
      # ── Locations ─────────────────────────────────────────────
      - Njord__Locations__0__Name=home
      - Njord__Locations__0__Latitude=47.05
      - Njord__Locations__0__Longitude=8.31
      #- Njord__Locations__1__Name=office
      #- Njord__Locations__1__Latitude=47.38
      #- Njord__Locations__1__Longitude=8.54
      # Latitude and Longitude are required for every location.

      # ── Polling & Forecast ─────────────────────────────────────
      #- Njord__Polling__PollInterval=01:00:00
      #- Njord__Forecast__ForecastDays=4     # 1-16
      #- Njord__Forecast__PastHours=0        # 0-96
      #- Njord__Forecast__Models__0=         # empty = best_match
      # Primary weather comes from the deterministic Forecast API (best_match, high-res).
      # Forecast days per domain (only used when an enabled feature needs the domain):
      #- Njord__AirQuality__ForecastDays=5   # 1-7
      #- Njord__AirQuality__Region=Global   # Global, Europe (adds ammonia, olive pollen), UnitedStates (adds US AQI)
      #- Njord__Marine__ForecastDays=8       # 1-8
      #- Njord__Flood__ForecastDays=92       # 1-210
      #- Njord__Flood__IncludeEnsemble=false # 50 GloFAS members, adds confidence to FloodRisk, costs 5 calls per flood request
      # Features decide which domains are polled (the union of what the enabled ones read).
      # 6 domains: Forecast, Ensemble (spread + comparison), AirQuality, Flood, Marine, Seasonal.
      # On by default: the 15 weather alerts (Frost, Heat, ..., RainProbability), Commute, Pollen, Pm25.
      # Switch single features on (adds their domain) or off:
      #- Njord__Features__Frost__Enabled=false
      #- Njord__Features__FloodRisk__Enabled=true
      #- Njord__Features__FloodRain__Enabled=true
      #- Njord__Features__Swimming__Enabled=true
      #- Njord__Features__Surf__Enabled=true # swell vs wind waves, scored from swell period/height and wind direction
      #- Njord__Features__Ventilation__Enabled=true
      #- Njord__Features__Exercise__Enabled=true
      #- Njord__Features__Laundry__Enabled=true
      #- Njord__Features__PollenTrend__Enabled=true
      #- Njord__Features__Dust__Enabled=true       # Saharan dust concentration alert (off by default)
      #- Njord__Features__NightVentilation__Enabled=true
      #- Njord__Features__ConfidenceTrend__Enabled=true
      # Ensemble comparison models (polled from ensemble-api.open-meteo.com when needed):
      #- Njord__Ensemble__ForecastDays=4     # 1-35
      #- Njord__Ensemble__Models__0=ecmwf_ifs025_ensemble_mean
      #- Njord__Ensemble__Models__1=ecmwf_aifs025_ensemble_mean # additional, only used with ModelComparison
      #- Njord__Features__ModelComparison__Enabled=true # compare all Models via the Ensemble domain
      #- Njord__Features__SeasonalOutlook__Enabled=true # 3-month outlook, one extra call per day and location
      #- Njord__Features__Pollen__Enabled=false
      # Poll interval of a model whose update cycle is not learned yet:
      #- Njord__Polling__DiscoveryInterval=00:20:00

      # ── Persistence ───────────────────────────────────────────
      #- Njord__Persistence__Provider=Sqlite
      #- Njord__Persistence__DataPath=data/njord.db
      ## Alternative for PostgreSQL (not defaults):
      #- Njord__Persistence__Provider=PostgreSql
      #- Njord__Persistence__ConnectionString=Host=db;Database=njord;Username=njord;Password=secret

      # ── Budget (self-throttle below Open-Meteo free tier) ─────
      #- Njord__Polling__BudgetOverride__RequestsPerMonth=300000
      #- Njord__Polling__BudgetOverride__RequestsPerMinute=600

      # ── New features (off by default, enable individually) ────────
      # Energy
      #- Njord__Features__HeatPumpCop__Enabled=true
      #- Njord__Features__HeatPumpCop__TargetTemperature=35
      #- Njord__Features__SolarYield__BatteryCapacityKwh=10
      # Health & Wellness
      #- Njord__Features__MigraineRisk__Enabled=true
      #- Njord__Features__SleepQuality__Enabled=true
      #- Njord__Features__AsthmaRisk__Enabled=true
      # Agriculture
      #- Njord__Features__IrrigationNeed__Enabled=true
      #- Njord__Features__SprayWindow__Enabled=true
      # Atmospheric Insights
      #- Njord__Features__InversionDetection__Enabled=true
      #- Njord__Features__AtmosphericStability__Enabled=true
      #- Njord__Features__CloudCeiling__Enabled=true
      # Cross-domain
      #- Njord__Features__CompoundHeatStress__Enabled=true
      #- Njord__Features__AllergySeverity__Enabled=true

      # ── Feature settings (per feature, only values that differ from the default) ────────────────────────────────────────────
      #- Njord__Features__Frost__Thresholds__0=0
      #- Njord__Features__Frost__Thresholds__1=-5
      #- Njord__Features__Frost__Thresholds__2=-15
      #- Njord__Features__Heat__Thresholds__0=30
      #- Njord__Features__Heat__Thresholds__1=35
      #- Njord__Features__Heat__Thresholds__2=40
      #- Njord__Features__Storm__GustThresholds__0=17
      #- Njord__Features__Storm__GustThresholds__1=25
      #- Njord__Features__Storm__GustThresholds__2=33
      #- Njord__Features__HeavyRain__HourlyThreshold=10
      #- Njord__Features__HeavyRain__DailyThreshold=25
      #- Njord__Features__PressureDrop__Threshold=5
      #- Njord__Features__PressureDrop__SevereThreshold=10
      #- Njord__Features__Fog__PersistentHours=4
      #- Njord__Features__Thunderstorm__CapeThresholds__0=1000
      #- Njord__Features__Thunderstorm__PrecipThreshold=5
      #- Njord__Features__Thunderstorm__GustThreshold=20
      #- Njord__Features__Ice__Threshold=2

volumes:
  njord-data:
