  FrostDepthRisk risk = 3;
  double snow_insulation_cm = 4;
  double soil_temperature_c = 5;
}

message InversionDetectionCondition {
  ConditionData condition = 1;
  InversionStrength strength = 2;
  InversionType inversion_type = 3;
  double temperature_difference_c = 4;
  double boundary_layer_height_m = 5;
}

message AtmosphericStabilityCondition {
  ConditionData condition = 1;
  StabilityClass stability_class = 2;
  double cape_j_per_kg = 3;
  double cin_j_per_kg = 4;
  double lifted_index = 5;
}

message CloudCeilingCondition {
  ConditionData condition = 1;
  CeilingCategory ceiling_category = 2;
  int32 estimated_ceiling_m = 3;
  int32 cloud_cover_low_percent = 4;
  int32 cloud_cover_mid_percent = 5;
  int32 cloud_cover_high_percent = 6;
}

message SolarYield {
  ConditionData condition = 1;
  double kwh_per_kwp = 2;
  int32 peak_hour = 3;
}

message ApproachingFront {
  ConditionData condition = 1;
  double estimated_in_hours = 2;
  double pressure_drop = 3;
  double temperature_drop = 4;
}

message ConfidenceTrend {
  TrendData trend = 1;
  ConfidenceTrendDirection direction = 2;
  double magnitude = 3;
  double current_avg_std_dev = 4;
  double previous_avg_std_dev = 5;
}

message PollenTrend {
  TrendData trend = 1;
  optional PollenType peak_type = 2;
  optional google.protobuf.Timestamp peak_time = 3;
  optional PollenTrendDirection birch = 4;
  optional PollenTrendDirection grass = 5;
  optional PollenTrendDirection alder = 6;
  optional PollenTrendDirection mugwort = 7;
}

message SeasonalMonthEntry {
  int32 year = 1;
  int32 month = 2;
  double temperature_anomaly = 3;
  double precipitation_anomaly_percent = 4;
  ConfidenceLevel confidence = 5;
}

message SeasonalOutlook {
  ForecastData forecast = 1;
  repeated SeasonalMonthEntry months = 2;
}

message ModelDayValues {
  string model = 1;
  optional double max_temperature = 2;
  optional double min_temperature = 3;
  optional double precipitation = 4;
}

message ModelComparisonDay {
  int32 year = 1;
  int32 month = 2;
  int32 day = 3;
  repeated ModelDayValues models = 4;
}

message ModelComparison {
  ForecastData forecast = 1;
  repeated ModelComparisonDay days = 2;
}

message GrowingDegreeDayEntry {
  int32 year = 1;
  int32 month = 2;
  int32 day = 3;
  double gdd = 4;
}

message GrowingDegreeForecast {
  ForecastData forecast = 1;
  repeated GrowingDegreeDayEntry days = 2;
  double cumulative_gdd = 3;
}
