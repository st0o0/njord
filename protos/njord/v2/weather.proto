syntax = "proto3";

package njord.v2;

import "google/protobuf/timestamp.proto";
import "njord/v2/common.proto";

option csharp_namespace = "Njord.Grpc.V2";

service WeatherService {
  rpc GetCatalog (GetCatalogRequest) returns (GetCatalogResponse);
  rpc GetDomainData (GetDomainDataRequest) returns (DomainDataUpdate);
  rpc GetEnrichments (GetEnrichmentsRequest) returns (GetEnrichmentsResponse);
  rpc StreamDomainData (StreamDomainDataRequest) returns (stream DomainDataUpdate);
  rpc StreamEnrichments (StreamEnrichmentsRequest) returns (stream EnrichmentEvent);
}

// ═══════════════════════════════════════
// Catalog
// ═══════════════════════════════════════

message GetCatalogRequest {}

message GetCatalogResponse {
  repeated LocationInfo locations = 1;
  repeated ModelInfo models = 2;
}

// ═══════════════════════════════════════
// Domain data
// ═══════════════════════════════════════

enum Domain {
  reserved 4, 7; // 7 was DOMAIN_SATELLITE
  DOMAIN_UNSPECIFIED = 0;
  DOMAIN_FORECAST = 1;
  DOMAIN_AIR_QUALITY = 2;
  DOMAIN_FLOOD = 3;
  DOMAIN_MARINE = 5;
  DOMAIN_SEASONAL = 6;
  DOMAIN_ENSEMBLE = 8;
}

message GetDomainDataRequest {
  string location = 1;
  Domain domain = 2;
  // Forecast only. Empty selects the primary model; unknown or disabled ids return NOT_FOUND.
  string model = 3;
}

message StreamDomainDataRequest {
  // Empty streams every location.
  string location = 1;
  // Empty streams every domain.
  repeated Domain domains = 2;
}

message DomainDataUpdate {
  reserved 13, 15; // 15 was satellite
  string location = 1;
  Domain domain = 2;
  google.protobuf.Timestamp model_run = 3;
  // Set only for forecast updates: the model id the data belongs to.
  string model = 4;
  oneof data {
    ForecastDomainData forecast = 10;
    AirQualityData air_quality = 11;
    FloodData flood = 12;
    MarineData marine = 14;
    SeasonalData seasonal = 16;
    EnsembleData ensemble = 17;
  }
}

message ForecastDomainData {
  repeated ForecastSample points = 1;
}

message ForecastSample {
  google.protobuf.Timestamp valid_at = 1;
  double temperature = 2;
  double apparent_temperature = 3;
  double wind_speed = 4;
  double precipitation = 5;
  double precipitation_probability = 6;
  double cloud_cover = 7;
  double pressure = 8;
  int32 weather_code = 9;
  double humidity = 10;
  double dew_point = 11;
  double uv_index = 12;
  reserved 13;
  optional double wind_gusts = 14;
  optional double visibility = 15;
  optional double cape = 16;
  optional double rain = 17;
  optional double snowfall = 18;
  optional double soil_temperature = 19;
  optional double freezing_level_height = 20;
  optional bool is_day = 21;
  optional double uv_index_clear_sky = 22;
  optional double showers = 23;
  optional double soil_moisture_0_to_1cm = 24;
  optional double soil_moisture_1_to_3cm = 25;
  optional double evapotranspiration = 26;
  optional double vapour_pressure_deficit = 27;
  optional double boundary_layer_height = 28;
  optional double cloud_cover_low = 29;
  optional double cloud_cover_mid = 30;
  optional double cloud_cover_high = 31;
  optional double convective_inhibition = 32;
  optional double lifted_index = 33;
  optional double surface_pressure = 34;
  optional double wind_speed_80m = 35;
  optional double wind_direction_80m = 36;
  optional double wind_speed_120m = 37;
  optional double wind_direction_120m = 38;
  optional double temperature_80m = 39;
  optional double temperature_120m = 40;
}

message AirQualityData {
  repeated AirQualitySample points = 1;
}

message AirQualitySample {
  google.protobuf.Timestamp valid_at = 1;
  double pm25 = 2;
  double pm10 = 3;
  double ozone = 4;
  optional double birch_pollen = 5;
  optional double grass_pollen = 6;
  optional double alder = 7;
  optional double mugwort = 8;
  optional double carbon_monoxide = 9;
  optional double sulphur_dioxide = 10;
  optional double dust = 11;
  optional double ammonia = 12;
  optional double olive_pollen = 13;
  optional double us_aqi = 14;
  optional double uv_index = 15;
  optional double uv_index_clear_sky = 16;
  optional double ragweed_pollen = 17;
  optional double european_aqi_pm25 = 18;
  optional double european_aqi_pm10 = 19;
  optional double european_aqi_nitrogen_dioxide = 20;
  optional double european_aqi_ozone = 21;
  optional double european_aqi_sulphur_dioxide = 22;
  optional double aerosol_optical_depth = 23;
  optional double carbon_dioxide = 24;
  optional double methane = 25;
  optional double us_aqi_pm25 = 26;
  optional double us_aqi_pm10 = 27;
  optional double us_aqi_nitrogen_dioxide = 28;
  optional double us_aqi_ozone = 29;
  optional double us_aqi_sulphur_dioxide = 30;
  optional double us_aqi_carbon_monoxide = 31;
}

message FloodData {
  repeated FloodSample points = 1;
}

message FloodSample {
  google.protobuf.Timestamp valid_at = 1;
  double discharge = 2;
  reserved 3, 4, 5;
  optional double discharge_mean = 6;
  optional double discharge_median = 7;
  optional double discharge_max = 8;
  optional double discharge_min = 9;
  optional double discharge_p25 = 10;
  optional double discharge_p75 = 11;
}

// Monthly ensemble-mean anomalies (K, mm); a missing value is unset.
message SeasonalData {
  repeated SeasonalSample points = 1;
}

message SeasonalSample {
  google.protobuf.Timestamp valid_at = 1;
  optional double temperature_anomaly = 2;
  optional double precipitation_anomaly = 3;
  optional double precipitation_mean = 4;
}

message MarineData {
  repeated MarineSample points = 1;
}

message MarineSample {
  google.protobuf.Timestamp valid_at = 1;
  double wave_height = 2;
  double wave_period = 3;
  double wave_direction = 4;
  optional double water_temperature = 5;
  optional double wind_wave_height = 6;
  optional double wind_wave_period = 7;
  optional double wind_wave_direction = 8;
  optional double wind_wave_peak_period = 9;
  optional double swell_wave_height = 10;
  optional double swell_wave_period = 11;
  optional double swell_wave_direction = 12;
  optional double swell_wave_peak_period = 13;
  optional double sea_level_height_msl = 14;
  optional double ocean_current_velocity = 15;
  optional double ocean_current_direction = 16;
  optional double secondary_swell_wave_height = 17;
  optional double secondary_swell_wave_direction = 18;
  optional double secondary_swell_wave_period = 19;
  optional double tertiary_swell_wave_height = 20;
  optional double tertiary_swell_wave_direction = 21;
  optional double tertiary_swell_wave_period = 22;
  optional double invert_barometer_height = 23;
}

message EnsembleData {
  repeated EnsembleSample points = 1;
}

message EnsembleSample {
  google.protobuf.Timestamp valid_at = 1;
  optional double temperature_spread = 2;
  optional double precipitation_spread = 3;
  optional double wind_speed_spread = 4;
}

// ═══════════════════════════════════════
// Enrichments (one typed message per feature result, all domains)
// ═══════════════════════════════════════

message GetEnrichmentsRequest {
  string location = 1;
}

message GetEnrichmentsResponse {
  reserved 2 to 9;
  reserved "alerts", "lifestyle";
  string location = 1;
  repeated EnrichmentEvent events = 10;
}

message StreamEnrichmentsRequest {
  string location = 1;
}

// One feature result. The oneof case identifies the feature. Field number ranges per output kind:
// alerts 20-49 (+55), scores 50-58, conditions 60-79 (+82-84), trends 80-81, forecasts 90-99.
message EnrichmentEvent {
  reserved 2, 10, 11, 12, 13, 14, 15, 67; // 67 was satellite_radiation
  reserved "type_name", "alerts", "lifestyle", "payload";
  string location = 1;
  google.protobuf.Timestamp updated_at = 3;
  oneof feature {
    FrostAlert frost = 20;
    HeatAlert heat = 21;
    StormAlert storm = 22;
    HeavyRainAlert heavy_rain = 23;
    UvAlert uv = 24;
    FogAlert fog = 25;
    SnowAlert snow = 26;
    PressureDropAlert pressure_drop = 27;
    ThunderstormAlert thunderstorm = 28;
    IceAlert ice = 29;
    WindChillAlert wind_chill = 30;
    VisibilityAlert visibility = 31;
    TropicalNightAlert tropical_night = 32;
    HumidityAlert humidity = 33;
    PollenAlert pollen = 34;
    Pm25Alert pm25 = 35;
    DustAlert dust = 36;
    FloodRiskAlert flood_risk = 37;
    FloodRainAlert flood_rain = 38;
    SwimmingConditionsAlert swimming_conditions = 39;
    RainProbabilityAlert rain_probability = 40;
    WetBulbDangerAlert wet_bulb_danger = 41;
    ClearSkyUvAlert clear_sky_uv = 42;
    SnowDepthWatchCondition snow_depth_watch = 69;
    ShowerAlert shower = 43;
    SmogRiskAlert smog_risk = 44;
    FireRiskAlert fire_risk = 45;
    PollenBlastAlert pollen_blast = 46;
    CoastalFloodAlert coastal_flood = 47;
    CompoundHeatStressAlert compound_heat_stress = 48;
    SoilMoistureCondition soil_moisture = 70;
    EvapotranspirationCondition evapotranspiration = 71;
    RagweedPollenCondition ragweed_pollen = 72;
    GranularAqiCondition granular_aqi = 73;
    OceanCurrentsCondition ocean_currents = 74;
    ElevatedWindCondition elevated_wind = 75;
    HeatPumpCopCondition heat_pump_cop = 76;
    SolarBatteryStrategyCondition solar_battery_strategy = 77;
    IrrigationNeedCondition irrigation_need = 78;
    FrostDepthCondition frost_depth = 79;
    Bbq bbq = 50;
    Laundry laundry = 51;
    Outdoor outdoor = 52;
    SurfConditions surf_conditions = 53;
    AllergySeverityScore allergy_severity = 54;
    MigraineRiskAlert migraine_risk = 55;
    SleepQualityScore sleep_quality = 56;
    AsthmaRiskScore asthma_risk = 57;
    SprayWindowScore spray_window = 58;
    CommuteSafety commute_safety = 60;
    VentilationWindow ventilation_window = 61;
    NightVentilation night_ventilation = 62;
    ExerciseAdvisory exercise_advisory = 63;
    Gardening gardening = 64;
    FloodTimeline flood_timeline = 65;
    SolarYield solar_yield = 66;
    ApproachingFront approaching_front = 68;
    ConfidenceTrend confidence_trend = 80;
    PollenTrend pollen_trend = 81;
    InversionDetectionCondition inversion_detection = 82;
    AtmosphericStabilityCondition atmospheric_stability = 83;
    CloudCeilingCondition cloud_ceiling = 84;
    SeasonalOutlook seasonal_outlook = 90;
    ModelComparison model_comparison = 91;
    GrowingDegreeForecast growing_degree = 92;
  }
}

// ═══════════════════════════════════════
// Base data per output kind
// ═══════════════════════════════════════

message AlertData {
  AlertSeverity severity = 1;
  double confidence = 2;
  double trigger_value = 3;
  double threshold = 4;
  optional double peak_value = 5;
  optional int32 hours_until = 6;
  optional int32 duration_hours = 7;
  ConfidenceLevel confidence_level = 8;
}

enum LimitingKind {
  LIMITING_KIND_UNSPECIFIED = 0;
  LIMITING_KIND_RAIN = 1;
  LIMITING_KIND_UV = 2;
  LIMITING_KIND_WIND = 3;
  LIMITING_KIND_TEMPERATURE_HIGH = 4;
  LIMITING_KIND_TEMPERATURE_LOW = 5;
  LIMITING_KIND_HUMIDITY = 6;
  LIMITING_KIND_POLLEN = 7;
  LIMITING_KIND_AIR_QUALITY = 8;
  LIMITING_KIND_VISIBILITY = 9;
  LIMITING_KIND_THUNDERSTORM = 10;
  LIMITING_KIND_DARKNESS = 11;
}

message LimitingFactor {
  LimitingKind kind = 1;
  google.protobuf.Timestamp from = 2;
  double value = 3;
}

message TimeWindow {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
  int32 score = 3;
  LimitingFactor limiting = 4;
}

message ScoreData {
  int32 score = 1;
  google.protobuf.Timestamp best_start = 2;
  int32 best_hours = 3;
  repeated TimeWindow windows = 4;
}

message ConditionData {}

message TrendData {}

message ForecastData {}

