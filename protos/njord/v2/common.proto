syntax = "proto3";

package njord.v2;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Njord.Grpc.V2";

// ═══════════════════════════════════════
// Location & Model
// ═══════════════════════════════════════

message LocationInfo {
  string name = 1;
  double latitude = 2;
  double longitude = 3;
  repeated string models = 4;
}

message ModelInfo {
  string id = 1;
  string display_name = 2;
  string provider = 3;
  string region = 4;
  CoverageTier coverage_tier = 5;
  optional int32 max_forecast_hours = 6;
  optional double resolution_km = 7;
  optional string description = 8;
}

enum CoverageTier {
  COVERAGE_TIER_UNSPECIFIED = 0;
  COVERAGE_TIER_GLOBAL = 1;
  COVERAGE_TIER_CONTINENTAL = 2;
  COVERAGE_TIER_REGIONAL = 3;
}

// ═══════════════════════════════════════
// Enrichment: Alerts
// ═══════════════════════════════════════

enum AlertType {
  ALERT_TYPE_UNSPECIFIED = 0;
  ALERT_TYPE_FROST = 1;
  ALERT_TYPE_HEAT = 2;
  ALERT_TYPE_STORM = 3;
  ALERT_TYPE_HEAVY_RAIN = 4;
  ALERT_TYPE_UV = 5;
  ALERT_TYPE_FOG = 6;
  ALERT_TYPE_SNOW = 7;
  ALERT_TYPE_PRESSURE_DROP = 8;
  ALERT_TYPE_THUNDERSTORM = 9;
  ALERT_TYPE_ICE = 10;
  ALERT_TYPE_WIND_CHILL = 11;
  ALERT_TYPE_VISIBILITY = 12;
  ALERT_TYPE_TROPICAL_NIGHT = 13;
  ALERT_TYPE_HUMIDITY = 14;
  ALERT_TYPE_POLLEN = 15;
  ALERT_TYPE_PM25 = 16;
  ALERT_TYPE_FLOOD_RISK = 17;
  ALERT_TYPE_FLOOD_RAIN = 18;
  ALERT_TYPE_SWIMMING_CONDITIONS = 19;
}

enum AlertSeverity {
  ALERT_SEVERITY_NONE = 0;
  ALERT_SEVERITY_YELLOW = 1;
  ALERT_SEVERITY_ORANGE = 2;
  ALERT_SEVERITY_RED = 3;
}

message Alert {
  AlertType type = 1;
  AlertSeverity severity = 2;
  double confidence = 3;
  double trigger_value = 4;
  double threshold = 5;
  optional double peak_value = 6;
  optional int32 hours_until = 7;
  optional int32 duration_hours = 8;
}

message AlertUpdate {
  repeated Alert alerts = 1;
}
