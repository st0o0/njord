syntax = "proto3";

package njord.v2;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Njord.Grpc.V2";

// ═══════════════════════════════════════
// Location & Model
// ═══════════════════════════════════════

message LocationInfo {
  string name = 1;
  double latitude = 2;
  double longitude = 3;
  repeated string models = 4;
}

message ModelInfo {
  string id = 1;
  string display_name = 2;
  string provider = 3;
  string region = 4;
  CoverageTier coverage_tier = 5;
  optional int32 max_forecast_hours = 6;
  optional double resolution_km = 7;
  optional string description = 8;
}

enum CoverageTier {
  COVERAGE_TIER_UNSPECIFIED = 0;
  COVERAGE_TIER_GLOBAL = 1;
  COVERAGE_TIER_CONTINENTAL = 2;
  COVERAGE_TIER_REGIONAL = 3;
}

// ═══════════════════════════════════════
// Forecast Points
// ═══════════════════════════════════════

message ParameterValue {
  string name = 1;
  oneof value {
    double numeric = 2;
    string text = 3;
    bool flag = 4;
  }
}

message HourlyForecast {
  google.protobuf.Timestamp valid_at = 1;
  optional double temperature = 2;
  optional double apparent_temperature = 3;
  optional double precipitation = 4;
  optional double humidity = 5;
  optional double wind_speed = 6;
  optional double wind_bearing = 7;
  optional double cloud_cover = 8;
  optional int32 weather_code = 9;
  optional bool is_day = 10;
  optional double rain = 11;
  optional double wind_gusts = 12;
  optional double pressure_msl = 13;
  repeated ParameterValue extra = 14;
}

message DailyForecast {
  string date = 1;
  optional double temperature_max = 2;
  optional double temperature_min = 3;
  optional double precipitation_sum = 4;
  optional double wind_speed_max = 5;
  optional double wind_gusts_max = 6;
  string sunrise = 7;
  string sunset = 8;
  optional int32 weather_code = 9;
  repeated ParameterValue extra = 10;
}

// ═══════════════════════════════════════
// Enrichment: Alerts
// ═══════════════════════════════════════

enum AlertType {
  ALERT_TYPE_UNSPECIFIED = 0;
  ALERT_TYPE_FROST = 1;
  ALERT_TYPE_HEAT = 2;
  ALERT_TYPE_STORM = 3;
  ALERT_TYPE_HEAVY_RAIN = 4;
  ALERT_TYPE_UV = 5;
  ALERT_TYPE_FOG = 6;
  ALERT_TYPE_SNOW = 7;
  ALERT_TYPE_PRESSURE_DROP = 8;
  ALERT_TYPE_THUNDERSTORM = 9;
}

enum AlertSeverity {
  ALERT_SEVERITY_NONE = 0;
  ALERT_SEVERITY_YELLOW = 1;
  ALERT_SEVERITY_ORANGE = 2;
  ALERT_SEVERITY_RED = 3;
}

message Alert {
  AlertType type = 1;
  AlertSeverity severity = 2;
  double confidence = 3;
  double trigger_value = 4;
  double threshold = 5;
  optional double peak_value = 6;
  optional int32 hours_until = 7;
  optional int32 duration_hours = 8;
}

message AlertUpdate {
  repeated Alert alerts = 1;
}

// ═══════════════════════════════════════
// Enrichment: Indices
// ═══════════════════════════════════════

message ScoreEnvelope {
  int32 min = 1;
  int32 max = 2;
  double confidence = 3;
}

message FrostInfo {
  int32 hours_until_frost = 1;
  double confidence = 2;
}

message VpdInfo {
  double kpa = 1;
  string category = 2;
}

message DayScoreSet {
  int32 day_offset = 1;
  int32 laundry = 2;
  int32 outdoor = 3;
  int32 running = 4;
  int32 cycling = 5;
  int32 bbq = 6;
  int32 irrigation = 7;
  int32 solar = 8;
  int32 night_ventilation = 9;
  int32 hours_included = 10;
  optional ScoreEnvelope laundry_envelope = 11;
  optional ScoreEnvelope outdoor_envelope = 12;
  optional ScoreEnvelope running_envelope = 13;
  optional ScoreEnvelope cycling_envelope = 14;
  optional ScoreEnvelope bbq_envelope = 15;
  optional ScoreEnvelope irrigation_envelope = 16;
  optional ScoreEnvelope solar_envelope = 17;
  optional ScoreEnvelope night_ventilation_envelope = 18;
}

message IndexUpdate {
  repeated DayScoreSet days = 1;
  optional FrostInfo frost = 2;
  optional VpdInfo vpd = 3;
}

// ═══════════════════════════════════════
// Enrichment: Trends
// ═══════════════════════════════════════

message ParameterTrend {
  string parameter = 1;
  string direction = 2;
  double delta = 3;
}

message TrendUpdate {
  repeated ParameterTrend parameter_trends = 1;
  optional string weather_change_description = 2;
  optional int32 precip_starts_in_hours = 3;
  optional int32 precip_ends_in_hours = 4;
  optional int32 temp_max_in_hours = 5;
  optional int32 temp_min_in_hours = 6;
  optional string stability_label = 7;
  optional double stability_ratio = 8;
  optional double decay_rate = 9;
  optional int32 reliable_hours = 10;
}

// ═══════════════════════════════════════
// Enrichment: Derived
// ═══════════════════════════════════════

message HorizonDerived {
  string horizon = 1;
  optional int32 beaufort = 2;
  optional double wind_chill = 3;
  optional string dewpoint_comfort = 4;
  optional string wmo_description = 5;
}

message ScalarDerived {
  optional double diurnal_amplitude = 1;
  optional double sunshine_pct = 2;
  optional bool inversion = 3;
}

message DerivedUpdate {
  repeated HorizonDerived by_horizon = 1;
  ScalarDerived scalars = 2;
}

// ═══════════════════════════════════════
// Enrichment: History
// ═══════════════════════════════════════

message ModelMetrics {
  string model = 1;
  optional double mae_7d = 2;
  optional double mae_30d = 3;
  double weight = 4;
  optional double drift = 5;
}

message HistoryUpdate {
  repeated ModelMetrics models = 1;
  optional string seasonal_best = 2;
  optional bool anomaly = 3;
  optional double anomaly_deviation = 4;
  optional double weighted_temperature = 5;
}

// ═══════════════════════════════════════
// Enrichment: Consensus
// ═══════════════════════════════════════

message HorizonConsensus {
  string horizon = 1;
  optional double median = 2;
  optional double trimmed_mean = 3;
  optional double spread = 4;
  optional double iqr = 5;
  optional double agreement = 6;
  int32 available_models = 7;
}

message ParameterConsensus {
  string parameter = 1;
  string unit = 2;
  repeated HorizonConsensus by_horizon = 3;
}

message ConsensusUpdate {
  repeated ParameterConsensus hourly_parameters = 1;
  repeated ParameterConsensus daily_parameters = 2;
}
