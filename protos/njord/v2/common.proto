syntax = "proto3";

package njord.v2;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Njord.Grpc.V2";

// ═══════════════════════════════════════
// Location & Model
// ═══════════════════════════════════════

message LocationInfo {
  string name = 1;
  double latitude = 2;
  double longitude = 3;
  repeated string models = 4;
}

message ModelInfo {
  string id = 1;
  string display_name = 2;
  string provider = 3;
  string region = 4;
  CoverageTier coverage_tier = 5;
  optional int32 max_forecast_hours = 6;
  optional double resolution_km = 7;
  optional string description = 8;
}

enum CoverageTier {
  COVERAGE_TIER_UNSPECIFIED = 0;
  COVERAGE_TIER_GLOBAL = 1;
  COVERAGE_TIER_CONTINENTAL = 2;
  COVERAGE_TIER_REGIONAL = 3;
}

// ═══════════════════════════════════════
// Enrichment: shared enums
// ═══════════════════════════════════════

enum AlertSeverity {
  ALERT_SEVERITY_NONE = 0;
  ALERT_SEVERITY_YELLOW = 1;
  ALERT_SEVERITY_ORANGE = 2;
  ALERT_SEVERITY_RED = 3;
}

enum ConfidenceLevel {
  CONFIDENCE_LEVEL_UNSPECIFIED = 0;
  CONFIDENCE_LEVEL_LOW = 1;
  CONFIDENCE_LEVEL_MEDIUM = 2;
  CONFIDENCE_LEVEL_HIGH = 3;
}
