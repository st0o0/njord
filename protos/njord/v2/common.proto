syntax = "proto3";

package njord.v2;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Njord.Grpc.V2";

// ═══════════════════════════════════════
// Location & Model
// ═══════════════════════════════════════

message LocationInfo {
  string name = 1;
  double latitude = 2;
  double longitude = 3;
  repeated string models = 4;
}

message ModelInfo {
  string id = 1;
  string display_name = 2;
  string provider = 3;
  string region = 4;
  CoverageTier coverage_tier = 5;
  optional int32 max_forecast_hours = 6;
  optional double resolution_km = 7;
  optional string description = 8;
}

enum CoverageTier {
  COVERAGE_TIER_UNSPECIFIED = 0;
  COVERAGE_TIER_GLOBAL = 1;
  COVERAGE_TIER_CONTINENTAL = 2;
  COVERAGE_TIER_REGIONAL = 3;
}

// ═══════════════════════════════════════
// Enrichment: Alerts
// ═══════════════════════════════════════

// What kind of sensor a feature result maps to; the feature itself is identified by its lowercase key.
enum OutputKind {
  OUTPUT_KIND_UNSPECIFIED = 0;
  OUTPUT_KIND_ALERT = 1;
  OUTPUT_KIND_SCORE = 2;
  OUTPUT_KIND_CONDITION = 3;
  OUTPUT_KIND_TREND = 4;
  OUTPUT_KIND_FORECAST = 5;
}

enum AlertSeverity {
  ALERT_SEVERITY_NONE = 0;
  ALERT_SEVERITY_YELLOW = 1;
  ALERT_SEVERITY_ORANGE = 2;
  ALERT_SEVERITY_RED = 3;
}

message Alert {
  reserved 1;
  AlertSeverity severity = 2;
  double confidence = 3;
  double trigger_value = 4;
  double threshold = 5;
  optional double peak_value = 6;
  optional int32 hours_until = 7;
  optional int32 duration_hours = 8;
  // Lowercase feature name (frost, heavyrain, pm25, floodrisk, ...).
  string key = 9;
}

message AlertUpdate {
  repeated Alert alerts = 1;
}
