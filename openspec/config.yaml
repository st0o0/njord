schema: spec-driven

# Injected verbatim into the AI when it generates change artifacts.
context: |
  njord — Multi-model weather intelligence for Home Assistant. A .NET service
  on Akka.NET + Akka.Streams that polls Open-Meteo and publishes Home
  Assistant entities via MQTT Discovery.

  Stack, structure, build/test commands, API facts and conventions live in
  `AGENTS.md` at the repo root — read it before writing artifacts.

  Hard constraints: all commands run from `src/`; tests are xUnit v3 on
  Microsoft.Testing.Platform — use `dotnet run --project ...`, NOT
  `dotnet test`; NEVER `git push` (the user pushes).

rules:
  proposal:
    - "Include an API-budget impact estimate (requests/month against the 300k free-tier limit) for any change that adds or alters polling."
    - "Always include a 'Non-goals' section."
  tasks:
    - "Reference concrete file paths under `src/Njord/...` and `src/Njord.Tests/...`."
    - "Every implementation chunk includes unit tests: `Spec` suffix, sealed class, `[Fact(Timeout = 5000)]`, BDD-style method names."
    - "Add a Validation section running the exact `dotnet run --project ...` commands (not `dotnet test`) for the touched suites."
